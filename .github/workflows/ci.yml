name: ci

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Builds the site (the API tests hit the built server) and runs both
      # suites: recipe data invariants, then the signup endpoint contract.
      - run: npm test
