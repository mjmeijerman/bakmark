name: deploy

# Every push to trunk deploys staging, but only if CI on that same commit
# passed: `workflow_run` fires when the ci workflow finishes, and the job below
# checks the conclusion. Deploying a red commit is how staging stops being a
# place you can trust.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [trunk]
  # Lets you deploy by hand from the Actions tab without a laptop checkout.
  # Staging is what a green push to trunk deploys; production is only ever
  # manual, because a merge should never reach real subscribers by itself.
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment"
        type: choice
        options: [staging, production]
        default: staging

# One deploy at a time, newest wins. Merging two PRs back to back fires two
# deploy runs a minute apart; the first has nothing left to do once the second
# is queued, and a queue that runs two deploys in parallel races on
# `git reset --hard` in the same checkout.
#
# Cancelling a running deploy is safe here: the run it is replaced by deploys
# the same checkout to the same commit, and deploy.sh keeps the old container
# until the new one is healthy, so the server converges either way. The one
# rough edge is that a cancelled run can leave its remote script finishing
# whatever step it was on; the run that supersedes it overwrites that state.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'trunk')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trunk
          fetch-depth: 0

      # The deploy runs the repository's own script on the server, so this step
      # only has to get there. No registry, no image upload, no token on the box.
      - name: Install the deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          BAKMARK_ENV: ${{ github.event.inputs.environment || 'staging' }}
          BAKMARK_HOST: ${{ secrets.STAGING_HOST }}
          BAKMARK_USER: ${{ secrets.STAGING_USER }}
          # Used by deploy.sh's post-deploy check, which asks Postfix whether the
          # smoke-test message actually left the queue.
          BAKMARK_TARGET_HOST: ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}
          # One Umami website per hostname, so each environment counts into its
          # own numbers. deploy.sh picks the one that matches BAKMARK_ENV; both
          # empty means no tracker is injected at all.
          UMAMI_SCRIPT_URL: ${{ secrets.UMAMI_SCRIPT_URL }}
          UMAMI_WEBSITE_ID_STAGING: ${{ secrets.UMAMI_WEBSITE_ID_STAGING }}
          UMAMI_WEBSITE_ID_PRODUCTION: ${{ secrets.UMAMI_WEBSITE_ID_PRODUCTION }}
        run: |
          # deploy.sh shells out to plain `ssh`, which does not read
          # GIT_SSH_COMMAND: that variable only affects git. Without an
          # IdentityFile in an ssh config, ssh offers its default keys, finds
          # none, and the server answers "Permission denied (publickey)".
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host $BAKMARK_HOST
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ./deploy.sh
