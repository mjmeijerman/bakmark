# The subscriber list lives outside the container, on purpose.
#
# `./data` is a bind mount: `docker compose down -v` cannot delete it, and
# rebuilding the image never touches it. On the VPS point BAKMARK_DATA_DIR at
# a directory outside this checkout, e.g. /var/lib/bakmark:
#
#   BAKMARK_DATA_DIR=/var/lib/bakmark docker compose up -d
#
# The container runs as uid 1000, so that directory must be owned by 1000:1000
# and mode 0700 (see README).

services:
  bakmark:
    build: .
    image: bakmark:local
    restart: unless-stopped
    init: true
    ports:
      # Loopback only: Caddy on the host is the public door. Keeps this port
      # out of the way of the other projects on the VPS.
      - "127.0.0.1:${BAKMARK_PORT:-8085}:4321"
    environment:
      SUBSCRIBERS_DB: /data/subscribers.sqlite
    volumes:
      - ${BAKMARK_DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
