# The subscriber list lives outside the container, on purpose.
#
# The data directory is a bind mount: `docker compose down -v` cannot delete it,
# and rebuilding the image never touches it. Each environment gets its own:
#
#   production  BAKMARK_DATA_DIR=/var/lib/bakmark
#   staging     BAKMARK_DATA_DIR=/var/lib/bakmark-staging
#   local       ./data
#
# There is no default. A staging container that fell back to ./data would be
# writing into the production list, which is the one mistake this file exists
# to make impossible.
#
# The container runs as uid 1000, so that directory must be owned by 1000:1000
# and mode 0700 (see README).

services:
  # Development mail catcher. Every mail the app sends locally lands here, in
  # the web UI on http://localhost:8025. It never forwards anything.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    read_only: true
    tmpfs:
      - /tmp

  bakmark:
    build: .
    image: bakmark:local
    restart: unless-stopped
    init: true
    ports:
      # Loopback only: Caddy on the host is the public door. Keeps this port
      # out of the way of the other projects on the VPS.
      - "127.0.0.1:${BAKMARK_PORT:-8085}:4321"
    environment:
      SUBSCRIBERS_DB: /data/subscribers.sqlite
      # The catcher by default. On the VPS set SMTP_URL to the real mail
      # server, otherwise confirmation mail is caught and never delivered.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SITE_URL: ${SITE_URL:-http://localhost:8085}
      # Staging: a comma-separated allowlist, e.g.
      #   SIGNUP_ALLOWED_DOMAINS=markmeijerman.eu,mail-tester.com
      # Empty means no restriction (development and production).
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
    volumes:
      # BAKMARK_DATA_DIR must be set: a staging container that silently falls
      # back to ./data would write into the production list. start.sh sets a
      # per-environment default, so this only bites a bare `docker compose up`.
      - ${BAKMARK_DATA_DIR:?set BAKMARK_DATA_DIR (start.sh does this for you)}:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
