# The subscriber list lives outside the container, on purpose.
#
# The data directory is a bind mount: `docker compose down -v` cannot delete it,
# and rebuilding the image never touches it. Each environment gets its own:
#
#   production  BAKMARK_DATA_DIR=/var/lib/bakmark
#   staging     BAKMARK_DATA_DIR=/var/lib/bakmark-staging
#   local       ./data
#
# There is no default. A staging container that fell back to ./data would be
# writing into the production list, which is the one mistake this file exists
# to make impossible.
#
# The container runs as uid 1000, so that directory must be owned by 1000:1000
# and mode 0700 (see README).

# The project name is per environment. Two checkouts on one host (staging and
# production) must not be able to `down` each other's containers.
name: ${COMPOSE_PROJECT_NAME:-bakmark}

services:
  # Development mail catcher. Every mail the app sends locally lands here, in
  # the web UI on http://localhost:8025. It never forwards anything.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    read_only: true
    tmpfs:
      - /tmp

  bakmark:
    build:
      context: .
      # These are baked into the HTML at build time: canonical URLs, the sitemap
      # and the noindex tag. Passing them only to the running container would
      # leave every page pointing at localhost.
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8085}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-}
        # Both empty by default: no collector configured, no script tag in the
        # HTML. Production sets them once the analytics stack runs.
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    # Per environment: a staging build must not overwrite the image a
    # production rollback would fall back to.
    image: bakmark:${BAKMARK_ENV:-local}
    restart: unless-stopped
    init: true
    ports:
      # Loopback only: Caddy on the host is the public door. Keeps this port
      # out of the way of the other projects on the VPS.
      - "127.0.0.1:${BAKMARK_PORT:-8085}:4321"
    environment:
      SUBSCRIBERS_DB: /data/subscribers.sqlite
      # The catcher by default. On the VPS set SMTP_URL to the real mail
      # server, otherwise confirmation mail is caught and never delivered.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SITE_URL: ${SITE_URL:-http://localhost:8085}
      # 1 = indexable. Unset means noindex, which is the safe failure: a site
      # nobody finds is recoverable, a staging copy in Google is not.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-}
      # Must be at a domain OpenDKIM signs. Empty falls back to the code
      # default, which is news.bakmark.nl for the same reason.
      MAIL_FROM: ${MAIL_FROM:-}
      # Envelope sender (Return-Path), split from From so bounces reach a domain
      # with an MX: bakmark.nl has one, news.bakmark.nl does not. Empty falls
      # back to the code default, bounce@bakmark.nl.
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:-}
      # Staging: a comma-separated allowlist, e.g.
      #   SIGNUP_ALLOWED_DOMAINS=markmeijerman.eu,mail-tester.com
      # Empty means no restriction (development and production).
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
    volumes:
      # BAKMARK_DATA_DIR must be set: a staging container that silently falls
      # back to ./data would write into the production list. start.sh sets a
      # per-environment default, so this only bites a bare `docker compose up`.
      - ${BAKMARK_DATA_DIR:?set BAKMARK_DATA_DIR (start.sh does this for you)}:/data
    # The host's Postfix is not 127.0.0.1 inside the container; that is the
    # container itself and the connection is refused. host-gateway is the
    # documented way to name the machine the daemon runs on.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
